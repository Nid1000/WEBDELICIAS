name: Implementar FTP de cPanel

on:
  workflow_dispatch:

concurrency:
  group: deploy-cpanel-ftp
  cancel-in-progress: true

jobs:
  deploy:
    name: Construir e implementar
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT || '21' }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar secrets FTP
        shell: bash
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_PORT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name no esta configurado en Settings > Secrets and variables > Actions."
              missing=1
            fi
          done

          if [[ "$FTP_SERVER" == FTP_SERVER=* || "$FTP_USERNAME" == FTP_USERNAME=* || "$FTP_PASSWORD" == FTP_PASSWORD=* || "$FTP_PORT" == FTP_PORT=* ]]; then
            echo "::error::Los secrets deben guardar solo el valor, no lineas tipo FTP_SERVER=valor."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_mysql, fileinfo, gd, zip, curl, openssl
          coverage: none

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias PHP de frontend
        working-directory: frontend
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Instalar dependencias PHP de backend
        working-directory: backend
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Instalar dependencias de Node para el frontend
        working-directory: frontend
        run: npm ci

      - name: Construir recursos de frontend
        working-directory: frontend
        run: npm run build

      - name: Preparar carpetas runtime de Laravel
        run: |
          for app in frontend backend; do
            mkdir -p "$app/storage/framework/cache/data"
            mkdir -p "$app/storage/framework/sessions"
            mkdir -p "$app/storage/framework/views"
            mkdir -p "$app/storage/logs"
            mkdir -p "$app/bootstrap/cache"
            touch "$app/storage/framework/cache/data/.gitkeep"
            touch "$app/storage/framework/sessions/.gitkeep"
            touch "$app/storage/framework/views/.gitkeep"
            touch "$app/storage/logs/.gitkeep"
            touch "$app/bootstrap/cache/.gitkeep"
          done

      - name: Implementar frontend en FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          port: ${{ env.FTP_PORT }}
          protocol: ftps
          local-dir: ./frontend/
          server-dir: ./frontend/
          state-name: .ftp-deploy-sync-state-frontend.json
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/tests/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**

      - name: Implementar backend en FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          port: ${{ env.FTP_PORT }}
          protocol: ftps
          local-dir: ./backend/
          server-dir: ./backend/
          state-name: .ftp-deploy-sync-state-backend.json
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/test/**
            **/tests/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/src/**
            **/prisma/**
            **/package-lock.json
            **/tsconfig*.json
            **/nest-cli.json
            **/eslint.config.mjs
